name: Android release APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install SDK packages
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Publish alpha APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET="jcode-mobile-alpha-0.1.0.apk"
          cp app/build/outputs/apk/release/app-release.apk "$ASSET"
          if ! gh release view alpha --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create alpha --repo "$GITHUB_REPOSITORY" \
              --title "JCode Mobile Alpha" \
              --prerelease \
              --notes "Rolling alpha build of the JCode Android client."
          fi
          gh release upload alpha "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
